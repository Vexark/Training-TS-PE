<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Training TS / PE</title>
<meta name="theme-color" content="#1a1a19">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="stylesheet" href="style.css">
<script>try { const t = localStorage.getItem('training-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<header class="entete">
  <a class="logo" href="#/"><span class="pastilles"><i style="background:var(--ts)"></i><i style="background:var(--pe)"></i></span>Training TS / PE</a>
  <nav class="nav" id="nav"></nav>
  <div class="droite"><span class="serie-entete" id="serie-entete" title="Jours d'affilée avec au moins une session"></span></div>
</header>
<main id="app"><p class="muet">Chargement de ta progression…</p></main>
<div class="toasts" id="toasts"></div>
<script type="module" src="js/app.js"></script>
<div id="installer" class="installer" hidden></div>
<script>
  // hors connexion : le service worker garde une copie de toute l'app dans le téléphone
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  // installation : bouton « Installer l'app » quand Chrome le permet, sinon explication (lien ouvert hors de Chrome…)
  (() => {
    const zone = document.getElementById('installer');
    const installee = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    if (installee) return;
    let proposition = null;
    const fermer = '<button type="button" class="bouton petit discret" data-fermer>Plus tard</button>';
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      proposition = e;
      zone.innerHTML = `<strong>Installe l'app sur ton téléphone</strong><span class="note">Icône dans tes applications, plein écran, marche sans réseau.</span><div class="ligne"><button type="button" class="bouton principal" data-installer>📲 Installer l'app</button>${fermer}</div>`;
      zone.hidden = false;
    });
    window.addEventListener('appinstalled', () => { zone.hidden = true; });
    zone.addEventListener('click', async (ev) => {
      if (ev.target.closest('[data-fermer]')) zone.hidden = true;
      if (ev.target.closest('[data-installer]') && proposition) { proposition.prompt(); await proposition.userChoice.catch(() => null); proposition = null; zone.hidden = true; }
    });
    setTimeout(() => {
      if (proposition) return;
      const ua = navigator.userAgent;
      const integre = /Instagram|FBAN|FBAV|WhatsApp|Snapchat|TikTok|LinkedInApp|; wv\)/.test(ua);
      const chrome = /Chrome\//.test(ua) && !/SamsungBrowser|EdgA|OPR|Firefox|MiuiBrowser/.test(ua);
      zone.innerHTML = `<strong>Pour installer l'app</strong><span class="note">${integre
        ? 'Ce lien est ouvert dans une autre application (Instagram, WhatsApp…), qui ne permet pas d\'installer. Touche ⋮ puis « Ouvrir dans Chrome », ou copie l\'adresse dans Chrome.'
        : chrome ? 'Menu ⋮ en haut à droite → « Ajouter à l\'écran d\'accueil » → choisis « Installer » (pas « Créer un raccourci »). Si rien ne se passe, recharge la page et attends 10 secondes.'
          : 'Ouvre cette adresse dans Google Chrome : c\'est lui qui installe l\'app proprement sur Android.'}</span><div class="ligne">${fermer}</div>`;
      zone.hidden = false;
    }, 6000);
  })();
</script>
</body>
</html>
